services:
    app:
        build: .
        ports:
            - "3000:3000"
        depends_on:
            - postgres
            - redis

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: docker
            POSTGRES_PASSWORD: docker
            POSTGRES_DB: webhookrelay
        ports:
            - "5432:5432"
    
    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"